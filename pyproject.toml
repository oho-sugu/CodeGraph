[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraph"
version = "0.1.0"
description = "Local Python code graphs and source annotations"
requires-python = ">=3.14,<3.15"

[project.scripts]
cg = "codegraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
